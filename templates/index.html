<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>groupie-tracker</title>
    <link rel="stylesheet" href="/styles/main.css" type="text/css" />

    <link rel="stylesheet" href="/styles/style.css" type="text/css" />

</head>

<body>
    <h1>You may also like</h1>

    <div class="filter">
        <h2>filter</h2>
        <div>
            <div>
                <div class="field">
                    <div id="creation_date">
                        <h3>Creation Date : </h3>
                        <div>
                            <label for="">From</label>
                            <input type="date" min="1970" max="2024">
                        </div>
                        <div>
                            <label for="">To</label>
                            <input type="date" min="1970" max="2024">
                        </div>
                    </div>


                    <div class="first_album">
                        <h3>First Album : 1970 - 2024</h3>
                        <div>
                            <div class="my_range">
                                <span>From</span>
                                <input type="range" min="1970" max="2024">
                                
                            </div>
                            <div class="my_range"> 
                                <input type="range" min="1970" max="2024">
                                <span>To</span>

                            </div>
                        </div>
                        <span class="creation_date">..</span>
                    </div>

                    <!-- members -->
                    <div>
                        <h3>number of members</h3>
                        <div class="members">
                            <div>
                                <label for="">1</label>
                                <input type="checkbox" value="1">
                            </div>
                            <div>
                                <label for="">2</label>
                                <input type="checkbox" value="2">
                            </div>

                            <div>
                                <label for="">3</label>
                                <input type="checkbox" value="3">
                            </div>
                            <div>
                                <label for="">4</label>
                                <input type="checkbox" value="4">
                            </div>
                            <div>
                                <label for="">5</label>
                                <input type="checkbox" value="5">
                            </div>
                            <div>
                                <label for="">6</label>
                                <input type="checkbox" value="6">
                            </div>

                            <div>
                                <label for="">7</label>
                                <input type="checkbox" value="7">
                            </div>
                            <div>
                                <label for="">8</label>
                                <input type="checkbox" value="8">
                            </div>
                            <div>
                                <label for="">9</label>
                                <input type="checkbox" value="9">
                            </div>
                            <div>
                                <label for="">10</label>
                                <input type="checkbox" value="10">
                            </div>
                        </div>
                    </div>
                    <!-- locations of concerts -->
                    <div>
                        <h3>locations of concerts</h3>
                        <select name="" id="">
                            <option value="london-uk">london-uk</option>
                            <option value="lyon-france">lyon-france</option>
                            <option value="lausanne-switzerland">lausanne-switzerland</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="container">
        {{range .}}
        <div class="card">
            <a href="/artists?q={{.ID}}">
                <div class="item">
                    <img class="name" src="{{.Img}}" />
                    <h3 class="name">{{.Name}}</h3>
                    <?xml version="1.0" standalone="no"?>
                    <?xml version="1.0" standalone="no"?>

                        </path>
                    </svg>
                </div>
            </a>
        </div>
        {{end}}
    </div>
    <footer>
        <p>groupie-tracker &copy;
            <script>document.write(new Date().getFullYear())</script>
        </p>
    </footer>

    <script>
        const creationDate = document.querySelector('.creation_date')
        document.querySelector('[type=range]').addEventListener('change', e => {
            creationDate.innerText = e.target.value
        })
    </script>
</body>

</html>
