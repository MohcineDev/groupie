<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>groupie-tracker</title>
    <link rel="stylesheet" href="/styles/main.css" type="text/css" />

    <link rel="stylesheet" href="/styles/style.css" type="text/css" />

</head>

<body>
    <button class="theme"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="#fff" class="size-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 18v-5.25m0 0a6.01 6.01 0 0 0 1.5-.189m-1.5.189a6.01 6.01 0 0 1-1.5-.189m3.75 7.478a12.06 12.06 0 0 1-4.5 0m3.75 2.383a14.406 14.406 0 0 1-3 0M14.25 18v-.192c0-.983.658-1.823 1.508-2.316a7.5 7.5 0 1 0-7.517 0c.85.493 1.509 1.333 1.509 2.316V18" />
      </svg>
      </button>
    <h1><a href="/">You may also like</a> </h1>

    <form class="filter" action="/search" method="get">
        <h2>filter</h2>
        <div class="field">
            <div class="creation_date">
                <h3>Creation Date : </h3>
                <div>
                    <div class="date_range my_range">
                        <label>From : </label>
                        <input type="range" id="dateFrom" min="1950" value="1950" max="2024" name="fromDate">

                    </div>
                    <div class="date_range my_range">
                        <label>To : </label>
                        <input type="range" id="dateTo" min="1950" value="2024" max="2024" name="toDate">
                    </div>
                </div>
                <span id="creation_date">..</span>

            </div>
            <div class="first_album">
                <h3>First Album : </h3>
                <div>
                    <div class="my_range">
                        <label>From : </label>
                        <input type="range" id="albumFrom" min="1950" value="1950" max="2024" name="fromAlbum">

                    </div>
                    <div class="my_range">
                        <label>To : </label>
                        <input type="range" id="albumTo" min="1950" max="2024" value="2024" name="toAlbum">
                    </div>
                </div>
                <span id="first_album">..</span>
            </div>

            <!-- members -->
            <div>
                <h3>number of members</h3>
                <div class="members">
                    <div>
                        <label for="member_1">1</label>
                        <input type="checkbox" value="1" id="member_1" name="member_1">
                    </div>
                    <div>
                        <label for="member_2">2</label>
                        <input type="checkbox" value="2" id="member_2" name="member_2">
                    </div>

                    <div>
                        <label for="member_3">3</label>
                        <input type="checkbox" value="3" id="member_3" name="member_3">
                    </div>
                    <div>
                        <label for="member_4">4</label>
                        <input type="checkbox" value="4" id="member_4" name="member_4">
                    </div>
                    <div>
                        <label for="member_5">5</label>
                        <input type="checkbox" value="5" id="member_5" name="member_5">
                    </div>
                    <div>
                        <label for="member_6">6</label>
                        <input type="checkbox" value="6" id="member_6" name="member_6">
                    </div>

                    <div>
                        <label for="member_7">7</label>
                        <input type="checkbox" value="7" id="member_7" name="member_7">
                    </div>
                    <div>
                        <label for="member_8">8</label>
                        <input type="checkbox" value="8" id="member_8" name="member_8">
                    </div>

                </div>
            </div>
            <!-- locations of concerts -->
            <div>
                <h3>locations of concerts</h3>
                <select name="location" id="">
                    <option value="all">select</option>
                    {{range .FilteredLocations}}

                    <option value="{{.}}">{{.}}</option>
                    {{end}}
                </select>
            </div>
        </div>
        <button type="submit">Search</button>
    </form>
    {{ if eq (len .ArtistsObj) 0 }}
    <div class="errormsg">Sorry. No matching results found</div>
    {{ else }}
    <div class="container">
        {{range .ArtistsObj}}
        <div class="card">
            <a href="/artists?q={{.ID}}">
                <div class="item">
                    <img class="name" src="{{.Img}}" />
                    <h3 class="name">{{.Name}}</h3>
                    <?xml version="1.0" standalone="no"?>
                   
                    <!-- <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="#eee" fill-opacity="1" d="M0,288L57.6,288L115.2,128L172.8,320L230.4,256L288,128L345.6,256L403.2,64L460.8,96L518.4,288L576,64L633.6,256L691.2,192L748.8,192L806.4,128L864,288L921.6,288L979.2,64L1036.8,288L1094.4,192L1152,96L1209.6,192L1267.2,128L1324.8,32L1382.4,288L1440,128L1440,0L1382.4,0L1324.8,0L1267.2,0L1209.6,0L1152,0L1094.4,0L1036.8,0L979.2,0L921.6,0L864,0L806.4,0L748.8,0L691.2,0L633.6,0L576,0L518.4,0L460.8,0L403.2,0L345.6,0L288,0L230.4,0L172.8,0L115.2,0L57.6,0L0,0Z"></path></svg> -->

                    <svg class="wave" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320">
                        <path id="waves" fill-opacity="1"
                            d="M0,192L9.6,181.3C19.2,171,38,149,58,128C76.8,107,96,85,115,106.7C134.4,128,154,192,173,186.7C192,181,211,107,230,74.7C249.6,43,269,53,288,48C307.2,43,326,21,346,32C364.8,43,384,85,403,117.3C422.4,149,442,171,461,170.7C480,171,499,149,518,138.7C537.6,128,557,128,576,133.3C595.2,139,614,149,634,133.3C652.8,117,672,75,691,58.7C710.4,43,730,53,749,69.3C768,85,787,107,806,133.3C825.6,160,845,192,864,181.3C883.2,171,902,117,922,112C940.8,107,960,149,979,176C998.4,203,1018,213,1037,186.7C1056,160,1075,96,1094,64C1113.6,32,1133,32,1152,69.3C1171.2,107,1190,181,1210,218.7C1228.8,256,1248,256,1267,240C1286.4,224,1306,192,1325,197.3C1344,203,1363,245,1382,266.7C1401.6,288,1421,288,1430,288L1440,288L1440,320L1430.4,320C1420.8,320,1402,320,1382,320C1363.2,320,1344,320,1325,320C1305.6,320,1286,320,1267,320C1248,320,1229,320,1210,320C1190.4,320,1171,320,1152,320C1132.8,320,1114,320,1094,320C1075.2,320,1056,320,1037,320C1017.6,320,998,320,979,320C960,320,941,320,922,320C902.4,320,883,320,864,320C844.8,320,826,320,806,320C787.2,320,768,320,749,320C729.6,320,710,320,691,320C672,320,653,320,634,320C614.4,320,595,320,576,320C556.8,320,538,320,518,320C499.2,320,480,320,461,320C441.6,320,422,320,403,320C384,320,365,320,346,320C326.4,320,307,320,288,320C268.8,320,250,320,230,320C211.2,320,192,320,173,320C153.6,320,134,320,115,320C96,320,77,320,58,320C38.4,320,19,320,10,320L0,320Z">
                        </path>
                    </svg>
                </div>
            </a>
        </div>
        {{end}}
        {{end}}
    </div>

    <footer>
        <p>groupie-tracker &copy;
            <script>document.write(new Date().getFullYear())</script>
        </p>
    </footer>

    <script>
        const theme = document.querySelector('.theme')
        const creationDate = document.querySelector('#creation_date')
        const dateFrom = document.querySelector('#dateFrom')
        const dateTo = document.querySelector('#dateTo')

        const firstAlbum = document.querySelector('#first_album')
        const albumFrom = document.querySelector('#albumFrom')
        const albumTo = document.querySelector('#albumTo')

        let localTheme = localStorage.getItem('theme')

        if (localTheme == 'dark') {
            document.body.classList.add('dark')
        }

        theme.addEventListener('click', () => {
            localTheme = localStorage.getItem('theme')
            if (localTheme == 'dark') {
                console.log(1321313231);
                
                document.body.classList.remove('dark')
                localStorage.setItem('theme', 'light')

            } else {
                localStorage.setItem('theme', 'dark')
                document.body.classList.add('dark')
            }
        })

        ///Creation Date
        dateFrom.addEventListener('change', e => {
            if (e.target.value === dateTo.max) {
                e.target.value -= 1
            }

            dateTo.min = parseInt(e.target.value) + 1

            creationDate.innerText = e.target.value + " - " + dateTo.value
        })
        creationDate.innerText = dateFrom.value + " - " + dateTo.value

        dateTo.addEventListener('change', e => {
            dateFrom.max = parseInt(e.target.value) - 1
            creationDate.innerText = dateFrom.value + " - " + e.target.value
        })


        //album
        albumFrom.addEventListener('change', e => {
            if (e.target.value === albumTo.max) {
                e.target.value -= 1
            }
            console.log(albumFrom)

            albumTo.min = parseInt(e.target.value) + 1

            firstAlbum.innerText = e.target.value + " - " + albumTo.value
        })
        firstAlbum.innerText = albumFrom.value + " - " + albumTo.value

        albumTo.addEventListener('change', e => {
            albumFrom.max = parseInt(e.target.value) - 1
            firstAlbum.innerText = albumFrom.value + " - " + e.target.value
        })




    </script>
</body>

</html>
